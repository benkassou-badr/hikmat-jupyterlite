name: Build and Deploy

on:
  push:
    branches:
      - main
  pull_request:
    branches:
      - '*'

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          python -m pip install -r requirements.txt

      - name: Create content directories
        run: |
          mkdir -p content/seconde
          mkdir -p content/premiere
          mkdir -p content/terminale
          mkdir -p content/maths-expertes

      - name: Build Seconde
        run: |
          jupyter lite build \
            --contents content/seconde \
            --output-dir dist/seconde

      - name: Build Premiere
        run: |
          jupyter lite build \
            --contents content/premiere \
            --output-dir dist/premiere

      - name: Build Terminale
        run: |
          jupyter lite build \
            --contents content/terminale \
            --output-dir dist/terminale

      - name: Build Maths Expertes
        run: |
          jupyter lite build \
            --contents content/maths-expertes \
            --output-dir dist/maths-expertes

      - name: Configure GitHub Pages
        uses: actions/configure-pages@v5

      - name: Upload artifact
        uses: actions/upload-pages-artifact@v4
        with:
          path: ./dist

  deploy:
    needs: build
    if: github.ref == 'refs/heads/main'

    permissions:
      pages: write
      id-token: write

    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}

    runs-on: ubuntu-latest

    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
